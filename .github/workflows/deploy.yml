name: CI/CD Pipeline HRIS Website

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Deploy HRIS to Dedicated VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧪 Clean Install & Build React HRIS (Di GitHub)
        run: |
          npm ci
          npm run build

      - name: 🚀 Sync & Build di VPS Dedicated (/var/www/hrd)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          sudo apt-get update && sudo apt-get install -y sshpass rsync

          echo "1. Menyiapkan folder /var/www/hrd & memastikan rsync terpasang di VPS..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "mkdir -p /var/www/hrd && (command -v rsync >/dev/null 2>&1 || (apt-get update -y && apt-get install -y rsync))"

          echo "2. Mengirim file website HRIS ke VPS..."
          sshpass -e rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            -e "ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p $PORT" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/hrd/"

          echo "3. Install module & Build HRIS di VPS..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p "$PORT" "$VPS_USER@$VPS_HOST" << 'ENDSSH'
          set -e
          export PATH=$PATH:/usr/local/bin:/usr/bin:~/.npm-global/bin
          cd /var/www/hrd

          npm ci
          npm install serve --no-save
          npm run build

          if command -v pm2 >/dev/null 2>&1; then
            pm2 delete hris-web || true
            pm2 save || true
          fi
          ENDSSH

      - name: ☸️ Deploy & Rollout Kubernetes (K3s) HRIS di VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          echo "4. Menjalankan Orkestrasi Pod & Ingress ramahaxor.my.id..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p "$PORT" "$VPS_USER@$VPS_HOST" << 'ENDK8S'
          set -e
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          mkdir -p /var/www/k8s-hrd
          cd /var/www/k8s-hrd

          cat << 'EOF' > deployment.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: hris-web
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: hris-web
            template:
              metadata:
                labels:
                  app: hris-web
              spec:
                enableServiceLinks: false
                containers:
                - name: web
                  image: node:20
                  workingDir: /app
                  command: ["sh", "-c", "./node_modules/.bin/serve -s dist -l tcp://0.0.0.0:3000"]
                  ports:
                  - containerPort: 3000
                  env:
                  - name: HOSTNAME
                    value: "0.0.0.0"
                  - name: PORT
                    value: "3000"
                  volumeMounts:
                  - name: hris-volume
                    mountPath: /app
                volumes:
                - name: hris-volume
                  hostPath:
                    path: /var/www/hrd
          EOF

          cat << 'EOF' > service.yaml
          apiVersion: v1
          kind: Service
          metadata:
            name: hris-service
          spec:
            type: NodePort
            selector:
              app: hris-web
            ports:
              - protocol: TCP
                port: 80
                targetPort: 3000
                nodePort: 30081
          EOF

          cat << 'EOF' > ingress.yaml
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: hris-ingress
            annotations:
              ingress.kubernetes.io/ssl-redirect: "false"
          spec:
            ingressClassName: traefik
            rules:
            - host: ramahaxor.my.id
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: hris-service
                      port:
                        number: 80
            - host: www.ramahaxor.my.id
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: hris-service
                      port:
                        number: 80
          EOF

          kubectl apply -f deployment.yaml || (kubectl delete -f deployment.yaml && kubectl apply -f deployment.yaml)
          kubectl apply -f service.yaml
          kubectl apply -f ingress.yaml
          kubectl rollout restart deployment/hris-web
          kubectl rollout status deployment/hris-web --timeout=90s
          kubectl get pods -l app=hris-web -o wide
          kubectl get svc hris-service
          kubectl get ingress hris-ingress
          ENDK8S
